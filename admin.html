<!doctype html>
<!-- Built by Vinayraj Kore -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<!-- Security headers (supplement with HTTP headers on your server) -->
<meta http-equiv="X-Content-Type-Options" content="nosniff" />
<meta http-equiv="X-XSS-Protection" content="1; mode=block" />
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
<meta name="author" content="Vinayraj Kore" />
<meta name="description" content="Administrator panel for the Department of Computer Engineering, Institute of Civil and Rural Engineering, Gargoti. View the student roster, manage administrator accounts and bulk-import students." />
<meta name="theme-color" content="#0B1220" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin Panel · Computer Engineering · ICRE Gargoti</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Load deployment config BEFORE the app script -->
<script src="config.js"></script>
<script src="security.js"></script>
<style>
:root{
  --ink:        #0B1220;
  --primary:    #1E293B;
  --primary-2:  #334155;
  --primary-dark:#0B1220;
  --accent:     #C2760C;
  --accent-light:#F7E6C9;
  --bg:         #F1F2F5;
  --bg-soft:    #E7E9EE;
  --card:       #FFFFFF;
  --line:       #DBDFE6;
  --line-soft:  #E7E9EE;
  --success:    #157F3C;
  --success-bg: #E6F5EA;
  --danger:     #B3261E;
  --danger-bg:  #FBEAE8;
  --muted:      #5B6474;
  --font-display: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', Consolas, monospace;
  --radius: 8px; --radius-sm: 6px;
  --shadow-sm: 0 1px 2px rgba(11,18,32,.06);
  --shadow-md: 0 10px 24px rgba(11,18,32,.14);
  --sidebar-w: 236px;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;}
a{color:inherit;}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;}
::selection{background:var(--accent-light);color:var(--primary-dark);}
.gear-line{height:3px;width:100%;background:var(--accent);opacity:.9;}
.gear-line.thin{height:2px;}
.seal{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;background:var(--primary-dark);box-shadow:var(--shadow-sm);flex:none;}
.seal img{display:block;object-fit:contain;}
.seal .fallback{font-family:var(--font-display);font-weight:700;color:var(--accent-light);}

/* ---------- site header (logo, college name, student portal button) ---------- */
.auth-page{min-height:100vh;display:flex;flex-direction:column;}
.site-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 28px;background:var(--primary-dark);border-bottom:1px solid rgba(255,255,255,.08);box-shadow:0 2px 10px rgba(11,18,32,.18);position:relative;z-index:2;flex-wrap:wrap;}
.site-header-brand{display:flex;align-items:center;gap:12px;min-width:0;}
.site-header-brand .seal{width:52px;height:52px;flex:none;background:rgba(255,255,255,.08);}
.site-header-brand .name{font-family:var(--font-display);font-weight:700;font-size:14px;line-height:1.3;color:#fff;}
.site-header-brand .name span{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-top:3px;}
.corner-link{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:6px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);color:#fff;font-size:12.5px;font-weight:600;text-decoration:none;letter-spacing:.01em;cursor:pointer;transition:background .15s ease;flex:none;white-space:nowrap;}
.corner-link:hover{background:rgba(255,255,255,.12);}
@media (max-width:480px){
  .site-header{padding:10px 14px;}
  .site-header-brand .name{font-size:12px;}
  .site-header-brand .name span{font-size:9px;}
  .corner-link{padding:7px 11px;font-size:11px;}
}
@media (max-width:360px){
  .site-header{padding:9px 12px;gap:8px;}
  .site-header-brand .seal{width:36px !important;height:36px !important;}
  .corner-link{font-size:10.5px;padding:6px 9px;}
}

/* ---------- login shell ---------- */
.login-shell{flex:1;display:grid;grid-template-columns:1.05fr 1fr;position:relative;}
@media (max-width:880px){.login-shell{grid-template-columns:1fr;}.login-left{display:none;}}
.login-left{position:relative;background:linear-gradient(165deg,#0B1220 0%,#141B2E 55%,#1E293B 130%);color:#E7EAF1;padding:56px 56px 40px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;}
.login-left::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px, transparent 1px);background-size:28px 28px;opacity:.6;}
.login-left::after{content:"";position:absolute;left:50%;top:52%;width:380px;height:380px;transform:translate(-50%,-50%);background:url('logo-watermark-hero.png') no-repeat center/contain;pointer-events:none;}
.login-hero{position:relative;z-index:1;}
.login-hero .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);}
.login-hero h1{font-family:var(--font-display);font-weight:700;font-size:clamp(30px,4vw,40px);line-height:1.14;margin:14px 0 18px;letter-spacing:-.01em;}
.login-hero p{font-size:14.5px;line-height:1.65;max-width:44ch;color:#AEB6C6;}
.login-foot{position:relative;z-index:1;display:flex;gap:28px;font-family:var(--font-mono);font-size:11px;color:#828DA3;}
.login-foot span b{color:#fff;display:block;font-family:var(--font-display);font-size:18px;font-weight:700;}
.login-right{display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;background:var(--bg);overflow-y:auto;}
@media(min-width:881px){.login-right{align-items:center;padding:40px 28px;}}
.login-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line-soft);border-radius:12px;padding:26px 20px 22px;box-shadow:var(--shadow-md);}
@media(min-width:440px){.login-card{padding:32px 30px 28px;}}
.login-card h2{font-family:var(--font-display);font-size:21px;font-weight:700;margin:0 0 6px;}
.login-card .sub{color:var(--muted);font-size:13.5px;margin-bottom:22px;}
.field{margin-bottom:15px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:6px;}
.field .req{color:var(--danger);}
/* 16px prevents iOS Safari auto-zoom on focus */
.field input,.field select{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:16px;background:#FBFBFC;color:var(--ink);outline:none;transition:border-color .12s ease,box-shadow .12s ease;-webkit-appearance:none;appearance:none;}
.field input:disabled{background:var(--bg-soft);color:var(--muted);}
.field input:focus,.field select:focus{border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(51,65,85,.14);}
.field .hint-sm{display:block;font-size:11px;color:var(--muted);margin-top:5px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:520px){.field-row{grid-template-columns:1fr;}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:13.5px;font-weight:600;font-family:var(--font-body);transition:filter .12s ease,background .12s ease,box-shadow .12s ease;min-height:44px;}
.btn-primary{background:var(--primary);color:#fff;width:100%;padding:11px;}
.btn-primary:hover:not(:disabled){filter:brightness(1.15);}
.btn-primary:disabled{opacity:.55;cursor:default;}
.btn-gold{background:var(--accent);color:#fff;}
.btn-gold:hover:not(:disabled){filter:brightness(1.06);}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
.btn-ghost:hover:not(:disabled){background:var(--bg-soft);}
.btn-danger{background:transparent;border:1.5px solid var(--danger);color:var(--danger);}
.btn-danger:hover:not(:disabled){background:var(--danger-bg);}
.btn-block{width:100%;}
.btn:disabled{opacity:.55;cursor:default;}
.link-btn{background:none;border:none;padding:0;color:var(--primary-2);font-weight:600;font-size:inherit;cursor:pointer;text-decoration:underline;font-family:inherit;min-height:44px;display:inline-flex;align-items:center;}
.login-note{margin-top:18px;font-size:12px;color:var(--muted);text-align:center;}
.login-error,.form-error{background:var(--danger-bg);color:var(--danger);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;margin-bottom:16px;font-weight:600;}
.form-ok{background:var(--success-bg);color:var(--success);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;margin-bottom:16px;font-weight:600;}

/* ---------- app shell ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{width:var(--sidebar-w);flex:none;background:var(--primary-dark);color:#B7BECC;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid #1B2436;}
.sidebar-crest{display:flex;align-items:center;gap:12px;padding:19px 18px 16px;}
.sidebar-crest .seal{width:50px;height:50px;}
.sidebar-crest .seal img{width:40px;height:40px;}
.sidebar-crest .name{font-family:var(--font-display);font-size:12px;line-height:1.25;font-weight:700;color:#fff;}
.sidebar-crest .dept{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;color:var(--accent);text-transform:uppercase;margin-top:3px;}
.sidebar nav{padding:8px 10px;display:flex;flex-direction:column;gap:1px;flex:1;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:#9AA3B5;text-decoration:none;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;transition:background .12s ease;}
.nav-item:hover{background:rgba(255,255,255,.05);}
.nav-item.active{background:rgba(194,118,12,.14);color:#fff;box-shadow:inset 3px 0 0 var(--accent);}
.sidebar-foot{padding:14px 18px 18px;border-top:1px solid rgba(255,255,255,.06);}
.user-chip{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.avatar{width:32px;height:32px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;color:#241703;flex:none;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.user-chip .who b{display:block;font-size:12.5px;color:#fff;}
.user-chip .who span{display:block;font-size:10.5px;color:#71798A;font-family:var(--font-mono);text-transform:capitalize;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;}
.main::before{content:"";position:fixed;left:calc(50% + var(--sidebar-w)/2);top:50%;width:340px;height:340px;transform:translate(-50%,-50%);background:url('logo-watermark-soft.png') no-repeat center/contain;pointer-events:none;z-index:0;}
.main>*{position:relative;z-index:1;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:15px 28px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(11,18,32,.05);position:relative;z-index:2;flex-wrap:wrap;gap:10px;}
.topbar-left{display:flex;align-items:center;gap:14px;min-width:0;}
.topbar h1{font-family:var(--font-display);font-size:18.5px;margin:0;font-weight:700;}
.topbar .crumb{font-family:var(--font-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
.content{padding:22px 28px 44px;flex:1 0 auto;}

/* ---------- mobile nav (hamburger + off-canvas sidebar) ---------- */
.menu-btn{display:none;align-items:center;justify-content:center;width:42px;height:42px;min-width:42px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;flex:none;padding:0;}
.menu-btn span{position:relative;display:block;width:18px;height:2px;background:var(--ink);}
.menu-btn span::before,.menu-btn span::after{content:"";position:absolute;left:0;width:18px;height:2px;background:var(--ink);}
.menu-btn span::before{top:-6px;}
.menu-btn span::after{top:6px;}
.sidebar-backdrop{display:none;}
@media (max-width:860px){
  .shell{display:block;}
  .menu-btn{display:inline-flex;}
  .sidebar{position:fixed;top:0;left:0;height:100dvh;z-index:80;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow-md);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-backdrop{display:block;position:fixed;inset:0;background:rgba(10,15,35,.5);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s ease;}
  .sidebar-backdrop.show{opacity:1;pointer-events:auto;}
  .main{width:100%;}
  .main::before{left:50%;width:260px;height:260px;}
}
@media (max-width:640px){
  .topbar{padding:12px 16px;}
  .topbar h1{font-size:16px;}
  .badge-dept{display:none;}
  .content{padding:12px 14px 28px;}
  .card-pad{padding:12px 14px;}
  .card-head{padding:12px 14px;flex-direction:column;align-items:stretch;}
  .card-head > *{width:100%;}
  .card-head h3{width:auto;}
  .grid{gap:12px;}
  .btn{min-height:44px;}
  .nav-item{min-height:44px;}
  .searchbar{min-width:0;width:100%;}
  .select-sm{width:100%;}
  .toast{left:12px;right:12px;bottom:12px;max-width:none;text-align:center;}
  .modal{max-height:92dvh;}
  .site-footer{flex-direction:column;padding:12px 14px;text-align:center;gap:4px;}
  .site-footer a{order:-1;}
  .field input,.field select{padding:10px 12px;}
}
@media (max-width:380px){
  .topbar h1{font-size:14.5px;}
  .content{padding:10px 10px 24px;}
}
.grid{display:grid;gap:16px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:900px){.grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:600px){.grid-3,.grid-2{grid-template-columns:1fr;}}
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
.card-pad{padding:18px 20px;}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;gap:10px;}
.card-head h3{margin:0;font-family:var(--font-display);font-size:14.5px;font-weight:700;}
.stat{display:flex;flex-direction:column;gap:5px;}
.stat .label{font-family:var(--font-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);}
.stat .num{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--primary);}
.stat .delta{font-size:11.5px;color:var(--success);}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:9px 20px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line-soft);background:var(--bg-soft);}
td{padding:10px 20px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
/* On narrow screens, tables collapse into aligned label/value rows instead of
   scrolling sideways (which was cutting columns off and looking misaligned). */
@media (max-width:640px){
  table.responsive-table thead{display:none;}
  table.responsive-table,table.responsive-table tbody,table.responsive-table tr,table.responsive-table td{display:block;width:100%;}
  table.responsive-table tr{padding:10px 14px;border-bottom:1px solid var(--line-soft);}
  table.responsive-table tr:last-child{border-bottom:none;}
  table.responsive-table td{border-bottom:none;padding:4px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:right;}
  table.responsive-table td::before{content:attr(data-label);font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;flex:none;}
  table.responsive-table td:empty::before{display:none;}
  table.responsive-table td.rt-photo{justify-content:flex-start;}
  table.responsive-table td.rt-photo::before{display:none;}
}
tr.clickable{cursor:pointer;}
tr.clickable:hover{background:var(--bg-soft);}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:10.5px;font-weight:600;}
.pill-green{background:var(--success-bg);color:var(--success);}
.pill-gold{background:var(--accent-light);color:#7A4B08;}
.pill-gray{background:var(--bg-soft);color:var(--muted);}
.pill-indigo{background:#E4E8F0;color:var(--primary-2);}
.searchbar{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:7px 11px;background:var(--bg-soft);min-width:220px;}
.searchbar input{border:none;background:transparent;outline:none;font-size:13px;width:100%;padding:0;}
.select-sm{border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:7px 10px;background:var(--bg-soft);font-size:12.5px;color:var(--ink);}
.badge-dept{font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;background:var(--primary);color:#fff;padding:3px 9px;border-radius:5px;}
.class-tag{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:5px;}
.class-FY{background:#E4E8F0;color:var(--primary-2);}
.class-SY{background:var(--accent-light);color:#7A4B08;}
.class-TY{background:var(--success-bg);color:var(--success);}
.class-ALL{background:#F4E4FB;color:#7A2E9E;}
.notice-card{border-bottom:1px solid var(--line-soft);padding:16px 0;}
.notice-card:last-child{border-bottom:none;}
.notice-card .n-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
.notice-card .n-title{font-weight:700;font-size:14.5px;}
.notice-card .n-body{font-size:13.5px;color:var(--ink);white-space:pre-wrap;margin:6px 0 8px;}
.notice-card .n-meta{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);letter-spacing:.02em;}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px;}
@media (max-width:520px){.kv{grid-template-columns:1fr;}}
.kv .item .k{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.kv .item .v{font-size:13.5px;}
.modal-backdrop{position:fixed;inset:0;background:rgba(11,18,32,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
.modal{background:var(--card);border-radius:var(--radius);max-width:560px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:var(--shadow-md);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line-soft);}
.modal-head h3{margin:0;font-family:var(--font-display);font-size:15.5px;}
.modal-close{background:none;border:none;font-size:19px;cursor:pointer;color:var(--muted);line-height:1;}
.modal-body{padding:18px 20px;}
.upload-zone{border:1.5px dashed var(--line);border-radius:var(--radius);padding:24px 20px;text-align:center;background:var(--bg);cursor:pointer;transition:border-color .12s ease,background .12s ease;display:flex;flex-direction:column;align-items:center;gap:2px;-webkit-tap-highlight-color:transparent;}
.upload-zone:hover,.upload-zone:focus-within{border-color:var(--accent);background:var(--accent-light);}
.upload-zone input[type=file]{display:none;}
.upload-zone .upload-icon{width:44px;height:44px;border-radius:50%;background:var(--accent-light);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:10px;flex:none;}
.upload-zone .upload-icon svg{width:20px;height:20px;}
.avatar-sm{width:30px;height:30px;border-radius:6px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);overflow:hidden;flex:none;}
.avatar-sm img{width:100%;height:100%;object-fit:cover;}

/* ---------- profile field on/off toggles ---------- */
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line-soft);}
.toggle-row:last-child{border-bottom:none;}
.toggle-row .t-label{font-size:13.5px;font-weight:600;}
.toggle-row .t-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
.switch{position:relative;display:inline-block;width:40px;height:23px;flex:none;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch .slider{position:absolute;inset:0;background:var(--line);border-radius:999px;cursor:pointer;transition:background .15s ease;}

/* =========================================================================
   API — every read/write goes to the Google Sheet through Apps Script
   ========================================================================= */
async function api(action, payload) {
  // Rate-limit all API calls to prevent abuse
  if (window.RateLimit && !window.RateLimit.check(action)) {
    return { ok: false, error: "Too many requests. Please wait a moment and try again." };
  }
  if (!API_URL || API_URL.indexOf("PASTE_") === 0 || API_URL.indexOf("YOUR_") === 0) {
    return { ok: false, error: "The panel isn't connected to a Google Sheet yet. Set API_URL in config.js." };
  }
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ action }, payload || {})),
    });
    if (!res.ok) throw new Error(`Server returned HTTP ${res.status}`);
    return await res.json();
  } catch (err) {
    return { ok: false, error: "Could not reach the server. Check your connection." };
  }
}

/* ---------- Cloudinary upload for certificates (browser → Cloudinary
   directly, unsigned) — mirrors student-portal.html so admin-added
   certificates land in the same place as student-added ones. ---------- */
async function uploadCertificateFile(file) {
  const form = new FormData();
  form.append("file", file);
  form.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

  const res = await fetch(CLOUDINARY_AUTO_UPLOAD_URL, { method: "POST", body: form });
  if (!res.ok) throw new Error("Certificate upload failed. Please try again.");
  const data = await res.json();
  if (!data.secure_url) throw new Error("Certificate upload failed. Please try again.");
  return data.secure_url;
}

/* ---------- tiny utils ---------- */
function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}
function fmtDate(iso) {
  if (!iso) return "";
  try { return new Date(iso).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }); }
  catch (e) { return iso; }
}
// Roll/enrollment numbers are usually numeric but stored as text, and
// students without one yet should sort to the end rather than the top.
function naturalCompare(a, b) {
  const av = String(a ?? "").trim(), bv = String(b ?? "").trim();
  if (!av && !bv) return 0;
  if (!av) return 1;
  if (!bv) return -1;
  const an = Number(av), bn = Number(bv);
  if (!isNaN(an) && !isNaN(bn)) return an - bn;
  return av.localeCompare(bv, undefined, { numeric: true, sensitivity: "base" });
}

// Columns offered in the "Export…" column picker. The academic column(s)
// depend on the class being exported: FY gets SSC marks, SY/TY get the
// previous-semester marks the student (or admin) recorded.
function exportColumnsFor(clsKey) {
  const cols = [
    { key: "photo", label: "Photo", get: (s) => s.photo || "" },
    { key: "rollNumber", label: "Roll No.", get: (s) => s.rollNumber || "" },
    { key: "enrollment", label: "Enrollment", get: (s) => s.enrollment || "" },
    { key: "name", label: "Name", get: (s) => s.name || "" },
    { key: "email", label: "Email", get: (s) => s.email || "" },
    { key: "phone", label: "Phone", get: (s) => s.phone || "" },
    { key: "dob", label: "Date of birth", get: (s) => fmtDate(s.dob) || "" },
    { key: "gender", label: "Gender", get: (s) => s.gender || "" },
    { key: "bloodGroup", label: "Blood group", get: (s) => s.bloodGroup || "" },
  ];
  if (clsKey === "FY") {
    cols.push({ key: "sscMarks", label: "SSC Marks (%)", get: (s) => s.sscMarks || "" });
  } else {
    cols.push({ key: "semester", label: "Semester", get: (s) => (s.semester ? `Semester ${s.semester}` : "") });
    cols.push({ key: "semMarks", label: "Sem Marks (%)", get: (s) => s.semMarks || "" });
  }
  cols.push(
    { key: "address", label: "Living address", get: (s) => [s.addr1, s.addr2, s.city, s.state, s.pincode].filter(Boolean).join(", ") },
    { key: "guardianAddress", label: "Guardian address", get: (s) => [s.gAddr1, s.gAddr2, s.gCity, s.gState, s.gPincode].filter(Boolean).join(", ") },
    { key: "guardianName", label: "Guardian name", get: (s) => s.guardianName || "" },
    { key: "guardianRelation", label: "Guardian relation", get: (s) => s.guardianRelation || "" },
    { key: "guardianPhone", label: "Guardian phone", get: (s) => s.guardianPhone || "" },
    { key: "guardianOccupation", label: "Guardian occupation", get: (s) => s.guardianOccupation || "" },
    { key: "createdAt", label: "Registered", get: (s) => fmtDate(s.createdAt) || "" },
    { key: "source", label: "Source", get: (s) => (s.source === "import" ? "Bulk import" : "Self-registered") }
  );
  return cols;
}

      @page{size:A4 landscape;margin:14mm;}
    </style></head>
    <body>
      <h1>Institute of Civil &amp; Rural Engineering, Gargoti &middot; ${DEPT_NAME}</h1>
      <p class="sub">Student Records &middot; ${classTag(clsKey)} &middot; ${list.length} student${list.length === 1 ? "" : "s"} &middot; Exported ${today}</p>
      <table><thead><tr><th>#</th>${head}</tr></thead><tbody>${body}</tbody></table>
      <script>
        window.onload = () => {
          const imgs = Array.from(document.images);
          const pending = imgs.filter((img) => !img.complete);
          if (!pending.length) { window.print(); return; }
          let left = pending.length;
          const done = () => { left -= 1; if (left <= 0) window.print(); };
          pending.forEach((img) => { img.addEventListener("load", done); img.addEventListener("error", done); });
        };
      <\/script>
    </body></html>`;

  const win = window.open("", "_blank");
  if (!win) { toast("Please allow pop-ups for this site to export a PDF.", "err"); return; }
  win.document.open(); win.document.write(doc); win.document.close();
}

function adminRoster() {
  const students = state.students || [];

  // Step 1: no class picked yet — show FY / SY / TY selection cards.
  if (!state.rosterClass) {
    const counts = classCountsFrom(students);
    const classCard = (clsKey) => `
      <button type="button" class="card card-pad stat" style="text-align:left;cursor:pointer;border:1.5px solid var(--line-soft);width:100%" data-act="select-roster-class" data-key="${clsKey}">

        <span class="num">${counts[clsKey]}</span>
        <span class="delta">${classTag(clsKey)} &middot; student${counts[clsKey] === 1 ? "" : "s"}</span>
      </button>`;

    return topbar("Admin Panel", "Student Records") + `
      <div class="content">
        <div class="card" style="margin-bottom:20px">
          <div class="card-head">
            <h3>Choose a class</h3>

          ${classCard("FY")}
          ${classCard("SY")}
          ${classCard("TY")}
        </div>
      </div>`;
  }

  // Step 2: a class is picked — show that class's roster only.
  const clsKey = state.rosterClass;
  const q = (state.staffQuery || "").trim().toLowerCase();
  let list = students.filter((s) => s.cls === clsKey);
  if (q) list = list.filter((s) => (s.name || "").toLowerCase().includes(q) || (s.enrollment || "").toLowerCase().includes(q) || (s.rollNumber || "").toLowerCase().includes(q) || (s.email || "").toLowerCase().includes(q));

  const sortKey = ROSTER_SORTS[state.rosterSort] ? state.rosterSort : "roll";

  const rowsFor = (items) => items.slice().sort(sortCmp).map((s) => {

    return `
    <tr class="clickable" data-act="view-student" data-id="${escapeHtml(s.id)}">

      <td data-label="Roll No.">${s.rollNumber ? escapeHtml(s.rollNumber) : "&mdash;"}</td>
      <td data-label="Enrollment">${escapeHtml(s.enrollment)}</td>
      <td data-label="Name">${escapeHtml(s.name)}</td>
      <td data-label="Email">${escapeHtml(s.email)}</td>
      <td data-label="Phone">${s.phone ? escapeHtml(s.phone) : "&mdash;"}</td>
    </tr>`;
  }).join("");

  return topbar("Admin Panel", `Student Records \u00b7 ${clsKey}`) + `
    <div class="content">
      <button type="button" class="btn btn-ghost" style="margin-bottom:16px" data-act="back-to-classes">&larr; All classes</button>
      <div class="card" style="margin-bottom:20px">
        <div class="card-head">

            <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)">Sort by

/* =========================================================================
   PASSOUT STUDENTS — Excel/CSV export
   ========================================================================= */
function doPassoutExportExcel(list) {
  if (!list.length) { toast("No records to export.", "err"); return; }
  const headers = ["#", "Full Name", "Contact Number", "Gender", "College / Organisation", "ID Card URL", "Submitted On"];
  const csvRows = [headers.join(",")];
  list.forEach((p, i) => {
    const row = [
      i + 1,
      `"${(p.name || "").replace(/"/g, '""')}"`,
      `"${(p.phone || "").replace(/"/g, '""')}"`,
      `"${(p.gender || "").replace(/"/g, '""')}"`,
      `"${(p.organization || "").replace(/"/g, '""')}"`,
      `"${(p.idCardUrl || "").replace(/"/g, '""')}"`,
      `"${p.submittedAt ? fmtDate(p.submittedAt) : ""}"`,
    ];
    csvRows.push(row.join(","));
  });
  const csv = csvRows.join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "passout_students.csv"; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("Excel/CSV file downloaded.");
}

   ========================================================================= */
function renderPortal() {
  const user = state.currentUser;
  if (!user) return `<div class="content"><div class="spinner-line">Loading your account&hellip;</div></div>`;
  return `<div class="shell">${sidebar()}<div class="main">${adminContent()}${siteFooter()}</div></div>`;

function render() {
  // Only re-focus the search box if the user was already typing in it —
  // otherwise every render (opening a tab, a background refresh, etc.)
  // steals focus and pops the mobile keyboard open unprompted.
  const activeEl = document.activeElement;
  const wasSearchFocused = !!(activeEl && activeEl.id === "staffSearch");
  const searchSelStart = wasSearchFocused ? activeEl.selectionStart : null;

  let html = "";
  if (state.screen === "login") html += renderLogin();
  else html += renderPortal();

  if (state.toast) {
    html += `<div class="toast ${state.toast.kind === "err" ? "err" : ""}" role="status">${escapeHtml(state.toast.text)}</div>`;
  }
  root.innerHTML = html;

  const search = document.getElementById("staffSearch");
  if (search) {
    if (wasSearchFocused) {
      search.focus();
      const pos = searchSelStart != null ? searchSelStart : search.value.length;
      search.setSelectionRange(pos, pos);
    }
    search.addEventListener("input", (e) => { state.staffQuery = e.target.value; render(); });
  }

  const rosterSortSelect = document.getElementById("rosterSortSelect");
  if (rosterSortSelect) {
    rosterSortSelect.addEventListener("change", (e) => { state.rosterSort = e.target.value; render(); });
  }

  const csvInput = document.getElementById("csvInput");
  if (csvInput) {
    csvInput.addEventListener("change", () => {
      const lbl = document.getElementById("csvZoneLabel");
      const file = csvInput.files[0];
      if (!file) return;
      if (lbl) lbl.textContent = file.name;
      const reader = new FileReader();
      reader.onload = () => handleCsvText(String(reader.result || ""));
      reader.readAsText(file);
    });
  }

  const adminCertificateInput = document.getElementById("adminCertificateInput");
  if (adminCertificateInput) {
    adminCertificateInput.addEventListener("change", () => {
      const lbl = document.getElementById("adminCertificateZoneLabel");
      if (lbl) lbl.textContent = adminCertificateInput.files[0] ? adminCertificateInput.files[0].name : "Click to choose a file";
    });
  }

  const passoutSearch = document.getElementById("passoutSearch");
  if (passoutSearch) {
    passoutSearch.focus();
    passoutSearch.addEventListener("input", (e) => { state.passoutQuery = e.target.value; render(); });
  }
}

/* =========================================================================
   CSV PARSE (client-side preview only — the actual write goes through the API)
   ========================================================================= */
function parseCsv(text) {
  const lines = text.split(/\r\n|\n|\r/).filter((l) => l.trim().length);
  if (!lines.length) return { header: [], rows: [] };
  const header = lines[0].split(",").map((h) => h.trim().toLowerCase());
  const rows = lines.slice(1).map((line) => {
    const cells = line.split(",").map((c) => c.trim());
    const obj = {};
    header.forEach((h, i) => { obj[h] = cells[i] || ""; });
    return obj;
  });
  return { header, rows };
}

function handleCsvText(text) {
  const pad = document.getElementById("csvPreviewPad");
  const { header, rows } = parseCsv(text);
  const required = ["name", "enrollment", "class", "email", "phone"];
  const missing = required.filter((r) => !header.includes(r));
  if (missing.length) {
    state.importPreview = null;
    if (pad) pad.innerHTML = `<div class="form-error">Missing column(s): ${missing.join(", ")}. Expected: name, enrollment, class, email, phone.</div>`;
    return;
  }
  const valid = [];
  const skipped = [];
  rows.forEach((r, i) => {
    const cls = (r["class"] || "").toUpperCase();
    if (!r.name || !r.enrollment || !r.email || CLASS_ORDER.indexOf(cls) === -1) { skipped.push(i + 2); return; }
    valid.push({ name: r.name, enrollment: r.enrollment, rollNumber: r.rollnumber || "", cls, email: r.email, phone: r.phone || "" });
  });
  state.importPreview = { rows: valid, skipped };
  if (pad) pad.innerHTML = renderCsvPreview(state.importPreview);
}

async function confirmImport() {
  if (!state.importPreview || !state.importPreview.rows.length) return;
  state.busy = true; render();
  const res = await api("importStudents", { rows: state.importPreview.rows });
  state.busy = false;
  if (!res.ok) { toast(res.error || "Import failed.", "err"); return render(); }
  state.importPreview = null;
  toast(`Imported ${res.count} student(s)${res.skippedRows && res.skippedRows.length ? `, ${res.skippedRows.length} row(s) skipped as duplicates` : ""}.`);
  await loadStudentsList();
  state.active = "roster";
  render();
}

/* =========================================================================

   ========================================================================= */
async function handleLoginSubmit(form) {
  const email = form.get("email").trim();
  const password = form.get("password");
  state.loginError = "";
  state.busy = true; render();

  const res = await api("login", { portal: "admin", email, password });
  state.busy = false;
  if (!res.ok) { state.loginError = res.error || "Sign in failed."; return render(); }
  if (res.role !== "admin") { state.loginError = "This account does not have administrator access."; return render(); }

  state.session = { id: res.user.id || res.user.email };
  state.currentUser = res.user;
  state.screen = "portal"; state.active = "overview";
  render();

  // These calls are independent, so fire them in parallel instead of
  // one after another — each one hits the Apps Script backend separately.
  loadStudentsList().then(render);
  loadAdminList().then(render);
  loadFieldSettings().then(render);
  loadNotices().then(render);
  loadPassoutStudents().then(render);
}

async function handleAddStaffSubmit(form) {
  const name = form.get("name").trim();
  const email = form.get("email").trim();
  const password = form.get("password");
  state.adminUsersMsg = "";
  if (!name || !email || !password) { state.adminUsersMsg = "Please fill in every field."; return render(); }
  if (password.length < 6) { state.adminUsersMsg = "Password must be at least 6 characters."; return render(); }

  state.busy = true; render();
  const res = await api("addStaff", { name, role: "admin", email, password });
  state.busy = false;
  if (!res.ok) { state.adminUsersMsg = res.error || "Could not create account."; return render(); }
  state.showAddAdmin = false;
  toast(`Admin account created for ${name}.`);
  await loadAdminList();
  render();
}

async function handleAddNoticeSubmit(form) {
  const title = form.get("title").trim();
  const body = form.get("body").trim();
  const targetClass = form.get("targetClass") || "ALL";
  state.noticeMsg = "";
  if (!title || !body) { state.noticeMsg = "Both a title and message are required."; return render(); }

  state.busy = true; render();
  const res = await api("addNotice", { title, body, targetClass, postedBy: state.currentUser.name });
  state.busy = false;
  if (!res.ok) { state.noticeMsg = res.error || "Could not post notice."; return render(); }
  const targetLabel = targetClass === "ALL" ? "all classes" : `${targetClass} students`;
  toast(`Notice posted to ${targetLabel}.`);
  await loadNotices();
  render();
}

async function handleDeleteNotice(id) {
  if (!confirm("Delete this notice? Students who haven't seen it yet won't see it anymore.")) return;
  state.busy = true; render();
  const res = await api("deleteNotice", { id });
  state.busy = false;
  if (!res.ok) { toast(res.error || "Could not delete notice.", "err"); return render(); }
  toast("Notice deleted.");
  await loadNotices();
  render();
}

    name: form.get("name").trim(), enrollment: form.get("enrollment").trim(), rollNumber: form.get("rollNumber").trim(), cls: form.get("cls"),
    email: form.get("email").trim(), phone: form.get("phone").trim(), dob: form.get("dob"), gender: form.get("gender"),
    bloodGroup: form.get("bloodGroup").trim(), addr1: form.get("addr1").trim(), addr2: form.get("addr2").trim(),
    city: form.get("city").trim(), state: form.get("state").trim(), pincode: form.get("pincode").trim(),
    gAddr1: form.get("gAddr1").trim(), gAddr2: form.get("gAddr2").trim(), gCity: form.get("gCity").trim(),
    gState: form.get("gState").trim(), gPincode: form.get("gPincode").trim(),
    guardianName: form.get("guardianName").trim(), guardianRelation: form.get("guardianRelation").trim(),
    guardianPhone: form.get("guardianPhone").trim(), guardianOccupation: form.get("guardianOccupation").trim(),
  };
  if (updates.cls === "FY") updates.sscMarks = form.get("sscMarks").trim();
  else { updates.semester = form.get("semester").trim(); updates.semMarks = form.get("semMarks").trim(); }
  state.editStudentMsg = "";
  if (!updates.name || !updates.enrollment || !updates.email) { state.editStudentMsg = "Name, enrollment and email are required."; return render(); }

  state.busy = true; render();
  const res = await api("updateStudent", { id: state.detailStudent.id, updates, asAdmin: true });
  state.busy = false;
  if (!res.ok) { state.editStudentMsg = res.error || "Could not save changes."; return render(); }

  state.detailStudent = res.student;
  state.editingStudent = false;
  toast(`${res.student.name}'s record has been updated.`);
  await loadStudentsList();
  state.detailStudent = (state.students || []).find((x) => x.id === res.student.id) || state.detailStudent;
  render();
}

async function handleToggleField(field, enabled) {
  state.busy = true; render();
  const res = await api("updateFieldSettings", { settings: { [field]: enabled } });
  state.busy = false;
  if (!res.ok) { toast(res.error || "Could not update setting.", "err"); return render(); }
  state.fieldSettings = res.settings;
  toast(`${FIELD_LABELS[field] || field} is now ${enabled ? "on" : "off"} for students.`);
  render();
}

async function handleToggleRegistration(enabled) {
  state.busy = true; render();
  const res = await api("updateFieldSettings", { settings: { registrationOpen: enabled } });
  state.busy = false;
  if (!res.ok) { toast(res.error || "Could not update setting.", "err"); return render(); }
  state.fieldSettings = res.settings;
  toast(`Student registration is now ${enabled ? "open" : "closed"}.`);
  render();
}

async function handleTogglePassoutForm(enabled) {
  state.busy = true; render();
  const res = await api("updateFieldSettings", { settings: { passoutFormOpen: enabled } });
  state.busy = false;
  if (!res.ok) { toast(res.error || "Could not update setting.", "err"); return render(); }
  state.fieldSettings = res.settings;
  toast(`Passout student form is now ${enabled ? "open" : "closed"}.`);
  render();
}

async function handleSetAllFields(enabled) {
  state.busy = true; render();
  const settings = {};
  FIELD_DEFS.forEach((f) => { settings[f.key] = enabled; });
  const res = await api("updateFieldSettings", { settings });
  state.busy = false;
  if (!res.ok) { toast(res.error || "Could not update settings.", "err"); return render(); }
  state.fieldSettings = res.settings;
  toast(`All profile fields turned ${enabled ? "on" : "off"} for students.`);
  render();
}

async function handleDeleteStaff(id) {
  state.busy = true; render();
  const res = await api("deleteStaff", { id });
  state.busy = false;
  if (!res.ok) { toast(res.error || "Could not remove account.", "err"); return render(); }
  toast("Account removed.");
  await loadAdminList();
  render();
}

async function handleDeleteStudent(id) {
  state.busy = true; render();
  const res = await api("deleteStudent", { id });
  state.busy = false;
  if (!res.ok) { toast(res.error || "Could not remove student.", "err"); return render(); }
  toast("Student record removed.");
  state.detailStudent = null;
  state.editingStudent = false;
  await loadStudentsList();
  render();
}

async function handleAdminCertificateSubmit(formEl) {
  if (!state.detailStudent) return;
  const studentId = state.detailStudent.id;
  const fd = new FormData(formEl);
  const academicYear = String(fd.get("academicYear") || "").trim();
  const organizingInstitute = String(fd.get("organizingInstitute") || "").trim();
  const eventName = String(fd.get("eventName") || "").trim();
  const status = String(fd.get("status") || "").trim();
  const input = formEl.querySelector('input[type="file"]');
  const file = input && input.files[0];

  if (!academicYear || !organizingInstitute || !eventName || !status) { toast("Please fill in every field.", "err"); return; }
  if (!file) { toast("Please choose a certificate file first.", "err"); return; }
  if (file.size > 5 * 1024 * 1024) { toast("File is too large (max 5 MB).", "err"); return; }

  state.busy = true; render();
  try {
    const fileUrl = await uploadCertificateFile(file);
    const res = await api("addCertificate", {
      studentId, academicYear, organizingInstitute, eventName, status, fileUrl,
    });
    state.busy = false;
    if (!res.ok) { toast(res.error || "Could not save certificate.", "err"); return render(); }
    state.certificates = [res.certificate, ...(state.certificates || [])];
    toast("Certificate saved.");
  } catch (err) {
    state.busy = false;
    toast(err.message || "Could not process that file. Please try again.", "err");
  }
  render();
}

async function handleAdminDeleteCertificate(id) {
  if (!state.detailStudent) return;
  if (!confirm("Delete this certificate? This can't be undone.")) return;
  state.busy = true; render();
  const res = await api("deleteCertificate", { id, studentId: state.detailStudent.id });
  state.busy = false;
  if (!res.ok) { toast(res.error || "Could not delete certificate.", "err"); return render(); }
  state.certificates = (state.certificates || []).filter((c) => c.id !== id);
  toast("Certificate deleted.");
  render();
}

/* =========================================================================
   EVENT DELEGATION
   ========================================================================= */
root.addEventListener("submit", (e) => {
  const formEl = e.target.closest("form[data-form]");
  if (!formEl) return;
  e.preventDefault();
  const kind = formEl.dataset.form;
  const fd = new FormData(formEl);
  const get = (k) => (fd.get(k) == null ? "" : String(fd.get(k)));
  const form = { get };

  if (kind === "login") return handleLoginSubmit(form);
  if (kind === "add-staff") return handleAddStaffSubmit(form);
  if (kind === "add-notice") return handleAddNoticeSubmit(form);
  if (kind === "edit-student") return handleAdminEditStudentSubmit(form);
  if (kind === "admin-certificate") return handleAdminCertificateSubmit(formEl);
});

root.addEventListener("change", (e) => {
  if (e.target.matches('[data-act="toggle-field"]')) {
    handleToggleField(e.target.dataset.field, e.target.checked);
  } else if (e.target.matches('[data-act="toggle-registration"]')) {
    handleToggleRegistration(e.target.checked);
  } else if (e.target.matches('[data-act="toggle-passout-form"]')) {
    handleTogglePassoutForm(e.target.checked);
  } else if (e.target.matches('[data-act="toggle-export-col"]')) {
    if (!state.exportCols) state.exportCols = new Set();
    const key = e.target.dataset.col;
    if (e.target.checked) state.exportCols.add(key); else state.exportCols.delete(key);
    render();
  }
});

root.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;

  if (act === "nav") {
    state.active = el.dataset.key; state.detailStudent = null; state.editingStudent = false; state.sidebarOpen = false;
    if (el.dataset.key === "roster") { state.rosterClass = null; state.staffQuery = ""; }
    if (el.dataset.key === "passout") { state.passoutQuery = ""; if (!state.passoutStudents) loadPassoutStudents().then(render); }
    state.showExport = false; state.exportCols = null;
    render();
    if (el.dataset.key === "overview") loadStudentsList().then(render);
  }
  else if (act === "select-roster-class") { state.rosterClass = el.dataset.key; state.staffQuery = ""; state.detailStudent = null; state.editingStudent = false; state.showExport = false; state.exportCols = null; render(); }
  else if (act === "back-to-classes") { state.rosterClass = null; state.staffQuery = ""; state.detailStudent = null; state.editingStudent = false; state.showExport = false; state.exportCols = null; render(); }
  else if (act === "logout") { state.session = null; state.currentUser = null; state.students = null; state.adminList = null; state.screen = "login"; state.active = "overview"; state.sidebarOpen = false; render(); }
  else if (act === "toggle-sidebar") { state.sidebarOpen = !state.sidebarOpen; render(); }
  else if (act === "close-sidebar") { state.sidebarOpen = false; render(); }
  else if (act === "show-add-staff") { state.showAddAdmin = true; state.adminUsersMsg = ""; render(); }
  else if (act === "cancel-add-staff") { state.showAddAdmin = false; render(); }
  else if (act === "confirm-import") { confirmImport(); }
  else if (act === "view-student") {
    state.detailStudent = (state.students || []).find((s) => s.id === el.dataset.id) || null;
    state.editingStudent = false; state.editStudentMsg = "";
    state.certificates = []; state.certificatesLoaded = false;
    render();
    if (state.detailStudent) loadCertificates(state.detailStudent.id).then(render);
  }
  else if (act === "close-modal") { if (e.target !== el) return; state.detailStudent = null; state.editingStudent = false; state.certificates = []; state.certificatesLoaded = false; render(); }
  else if (act === "edit-student") { state.editingStudent = true; state.editStudentMsg = ""; render(); }
  else if (act === "cancel-edit-student") { state.editingStudent = false; state.editStudentMsg = ""; render(); }
  else if (act === "delete-staff") { if (!el.disabled && confirm("Remove this admin account? This cannot be undone.")) handleDeleteStaff(el.dataset.id); }
  else if (act === "delete-notice") { handleDeleteNotice(el.dataset.id); }
  else if (act === "delete-student") { if (confirm("Remove this student's record? This cannot be undone.")) handleDeleteStudent(el.dataset.id); }
  else if (act === "delete-cert-admin") { handleAdminDeleteCertificate(el.dataset.id); }
  else if (act === "reload-students") { loadStudentsList().then(render); }
  else if (act === "open-export") { state.showExport = true; state.exportCols = null; render(); }
  else if (act === "close-export") { if (e.target !== el) return; state.showExport = false; render(); }
  else if (act === "export-select-all") { state.exportCols = new Set(exportColumnsFor(state.rosterClass).map((c) => c.key)); render(); }
  else if (act === "export-select-none") { state.exportCols = new Set(); render(); }
  else if (act === "confirm-export") {
    const clsKey = state.rosterClass;
    const q = (state.staffQuery || "").trim().toLowerCase();
    let list = (state.students || []).filter((s) => s.cls === clsKey);
    if (q) list = list.filter((s) => (s.name || "").toLowerCase().includes(q) || (s.enrollment || "").toLowerCase().includes(q) || (s.rollNumber || "").toLowerCase().includes(q) || (s.email || "").toLowerCase().includes(q));
    const sortKey = ROSTER_SORTS[state.rosterSort] ? state.rosterSort : "roll";
    list = list.slice().sort(ROSTER_SORTS[sortKey].cmp);
    doExportPdf(clsKey, list);
    state.showExport = false; render();
  }
  else if (act === "enable-all-fields") { handleSetAllFields(true); }
  else if (act === "disable-all-fields") { handleSetAllFields(false); }
  else if (act === "reload-passout") { loadPassoutStudents().then(render); }
  else if (act === "view-passout") {
    const q = (state.passoutQuery || "").trim().toLowerCase();
    const list = state.passoutStudents || [];
    const filtered = q ? list.filter((p) =>
      (p.name || "").toLowerCase().includes(q) ||
      (p.phone || "").toLowerCase().includes(q) ||
      (p.organization || "").toLowerCase().includes(q) ||
      (p.gender || "").toLowerCase().includes(q)
    ) : list;
    const idx = parseInt(el.dataset.idx, 10);
    state.detailPassout = filtered[idx] || null;
    render();
  }
  else if (act === "close-passout-modal") { if (e.target !== el) return; state.detailPassout = null; render(); }
  else if (act === "export-passout-pdf") {
    const q = (state.passoutQuery || "").trim().toLowerCase();
    const list = state.passoutStudents || [];
    const filtered = q ? list.filter((p) =>
      (p.name || "").toLowerCase().includes(q) ||
      (p.phone || "").toLowerCase().includes(q) ||
      (p.organization || "").toLowerCase().includes(q) ||
      (p.gender || "").toLowerCase().includes(q)
    ) : list;
    doPassoutExportPdf(filtered);
  }
  else if (act === "export-passout-excel") {
    const q = (state.passoutQuery || "").trim().toLowerCase();
    const list = state.passoutStudents || [];
    const filtered = q ? list.filter((p) =>
      (p.name || "").toLowerCase().includes(q) ||
      (p.phone || "").toLowerCase().includes(q) ||
      (p.organization || "").toLowerCase().includes(q) ||
      (p.gender || "").toLowerCase().includes(q)
    ) : list;
    doPassoutExportExcel(filtered);
  }
});

/* =========================================================================
   INIT — no session is ever persisted, so every load starts at the
   login screen with nothing to hydrate.
   ========================================================================= */
render();
</script>
</body>
</html>
